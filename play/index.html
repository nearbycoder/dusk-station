/* ---------- math ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let fxRand = mulberry32(12345);           // effects-only randomness
const rnd = (a = 1, b) => b === undefined ? fxRand() * a : a + fxRand() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));

/* ---------- colour + ordered dithering ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
const _rgbCache = {};
function rgb(hex) {
  let c = _rgbCache[hex];
  if (!c) { const n = parseInt(hex.slice(1), 16); c = _rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  return c;
}
function mixHex(a, b, t) {
  const A = rgb(a), B = rgb(b);
  const r = Math.round(lerp(A[0], B[0], t)), g = Math.round(lerp(A[1], B[1], t)), bl = Math.round(lerp(A[2], B[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
}

/* Pixel writer for cached artwork: plots into an ImageData then flushes. */
class PixBuf {
  constructor(w, h) { this.w = w; this.h = h; this.img = new ImageData(w, h); this.d = this.img.data; }
  set(x, y, hex) {
    x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const c = rgb(hex), i = (y * this.w + x) * 4;
    this.d[i] = c[0]; this.d[i + 1] = c[1]; this.d[i + 2] = c[2]; this.d[i + 3] = 255;
  }
  clear(x, y) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[(y * this.w + x) * 4 + 3] = 0; }
  has(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return false; return this.d[(y * this.w + x) * 4 + 3] > 0; }
  rect(x, y, w, h, hex) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, hex); }
  /* dithered rectangle between two tones; t (0..1) = amount of b */
  drect(x, y, w, h, a, b, t) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, bayer(x + i, y + j) < t ? b : a); }
  /* sparse dither: only plots colour where threshold < t (leaves other pixels) */
  sprinkle(x, y, w, h, hex, t) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (bayer(x + i, y + j) < t) this.set(x + i, y + j, hex); }
  /* vertical banded gradient through a colour list, dithered between neighbours */
  vgrad(x, y, w, h, cols, y0 = y, y1 = y + h) {
    const n = cols.length - 1;
    for (let j = 0; j < h; j++) {
      const p = clamp((y + j - y0) / Math.max(1, (y1 - y0)), 0, 1) * n;
      const i0 = Math.min(n, Math.floor(p)), f = p - i0, ca = cols[i0], cb = cols[Math.min(n, i0 + 1)];
      for (let i = 0; i < w; i++) this.set(x + i, y + j, bayer(x + i, y + j) < f ? cb : ca);
    }
  }
  disc(cx, cy, r, hex, t = 1) { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.6 && (t >= 1 || bayer(cx + i, cy + j) < t)) this.set(cx + i, cy + j, hex); }
  line(x0, y0, x1, y1, hex) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (; ;) { this.set(x0, y0, hex); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  }
  toCanvas() { const { c, x } = makeCanvas(this.w, this.h); x.putImageData(this.img, 0, 0); return c; }
}

/* Screen-space dither patterns (for overlays without alpha blending). */
const _patCache = new Map();
function ditherPattern(ctx, hex, level) { // level 0..16 = covered pixels out of 16
  level = clamp(level | 0, 0, 16);
  const key = hex + level;
  let p = _patCache.get(key);
  if (!p) {
    const { c, x } = makeCanvas(4, 4);
    x.fillStyle = hex;
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) if (BAYER[j * 4 + i] < level) x.fillRect(i, j, 1, 1);
    p = ctx.createPattern(c, 'repeat');
    _patCache.set(key, p);
  }
  return p;
}
function ditherFill(ctx, hex, level, x, y, w, h) {
  if (level <= 0) return;
  if (level >= 16) { ctx.fillStyle = hex; ctx.fillRect(x, y, w, h); return; }
  ctx.fillStyle = ditherPattern(ctx, hex, level);
  ctx.fillRect(x, y, w, h);
}

/* ---------- sprite helpers ---------- */
function asciiSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const pb = new PixBuf(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) { const ch = rows[y][x]; if (ch !== '.' && ch !== ' ' && pal[ch]) pb.set(x, y, pal[ch]); }
  return pb.toCanvas();
}
/* Adds a 1px 4-neighbour outline around opaque pixels. Returns new canvas (w+2,h+2). */
function outlineSprite(src, hex) {
  const w = src.width, h = src.height;
  const s = src.getContext('2d').getImageData(0, 0, w, h).data;
  const pb = new PixBuf(w + 2, h + 2);
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && s[(y * w + x) * 4 + 3] > 0;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    if (op(x, y)) continue;
    if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1)) pb.set(x + 1, y + 1, hex);
  }
  const out = pb.toCanvas();
  out.getContext('2d').drawImage(src, 1, 1);
  return out;
}
function flipSprite(src) {
  const { c, x } = makeCanvas(src.width, src.height);
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}
function silhouette(src, hex) {
  const { c, x } = makeCanvas(src.width, src.height);
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = hex; x.fillRect(0, 0, src.width, src.height);
  return c;
}

/* ============================== WORLD ==============================
   All rooms are stitched into one global tile grid, so collisions and
   room transitions are seamless. Rooms define camera bounds, art caches,
   enemy sets and map cells.
   =================================================================== */
const World = {
  rooms: [], byId: {}, cellRoom: new Map(), doors: [],
  gx0: 0, gy0: 0, gw: 0, gh: 0, tiles: null, dyn: [], objects: [],
  minCx: 0, maxCx: 0, minCy: 0, maxCy: 0
};

function buildWorld() {
  let minCx = 1e9, maxCx = -1e9, minCy = 1e9, maxCy = -1e9;
  for (const r of ROOMS) {
    minCx = Math.min(minCx, r.cx); maxCx = Math.max(maxCx, r.cx + r.cw - 1);
    minCy = Math.min(minCy, r.cy); maxCy = Math.max(maxCy, r.cy + r.ch - 1);
  }
  Object.assign(World, { minCx, maxCx, minCy, maxCy });
  World.gx0 = minCx * CW; World.gy0 = minCy * CH;
  World.gw = (maxCx - minCx + 1) * CW; World.gh = (maxCy - minCy + 1) * CH;
  World.tiles = new Uint8Array(World.gw * World.gh).fill(T_VOID);
  World.rooms = []; World.byId = {}; World.cellRoom.clear();
  ROOMS.forEach((def, idx) => {
    const w = def.cw * CW, h = def.ch * CH;
    const grid = new Array(w * h).fill(def.fill || '.');
    for (const [ch, x, y, rw, rh] of def.ops) {
      for (let j = y; j < y + rh; j++) for (let i = x; i < x + rw; i++) if (i >= 0 && j >= 0 && i < w && j < h) grid[j * w + i] = ch;
    }
    const room = {
      def, id: def.id, idx, name: def.name, reg: def.reg, w, h,
      tx: def.cx * CW, ty: def.cy * CH, x: def.cx * CPW, y: def.cy * CPH, pw: w * TILE, ph: h * TILE,
      cache: null
    };
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const ch = grid[j * w + i];
      const t = ch === 'X' ? T_VOID : (CHAR_TILE[ch] !== undefined ? CHAR_TILE[ch] : T_EMPTY);
      setTile(room.tx + i, room.ty + j, t);
    }
    for (let cy = def.cy; cy < def.cy + def.ch; cy++) for (let cx = def.cx; cx < def.cx + def.cw; cx++) World.cellRoom.set(cx + ',' + cy, room);
    World.rooms.push(room); World.byId[room.id] = room;
  });
  findDoors();
}
const tIndex = (tx, ty) => (ty - World.gy0) * World.gw + (tx - World.gx0);
function tileAt(tx, ty) {
  const lx = tx - World.gx0, ly = ty - World.gy0;
  if (lx < 0 || ly < 0 || lx >= World.gw || ly >= World.gh) return T_VOID;
  return World.tiles[ly * World.gw + lx];
}
function setTile(tx, ty, t) {
  const lx = tx - World.gx0, ly = ty - World.gy0;
  if (lx < 0 || ly < 0 || lx >= World.gw || ly >= World.gh) return;
  World.tiles[ly * World.gw + lx] = t;
}
function roomAtPx(px, py) { return World.cellRoom.get(Math.floor(px / CPW) + ',' + Math.floor(py / CPH)) || null; }
const isPassable = t => t === T_EMPTY || t === T_ONEWAY || t === T_WATER || t === T_HAZARD;

/* Openings between adjacent rooms become doors (used by the map). */
function findDoors() {
  World.doors = [];
  const seen = new Set();
  for (const a of World.rooms) {
    const d = a.def;
    for (let cy = d.cy; cy < d.cy + d.ch; cy++) for (let cx = d.cx; cx < d.cx + d.cw; cx++) {
      // right neighbour
      const br = World.cellRoom.get((cx + 1) + ',' + cy);
      if (br && br !== a) scanDoor(a, br, 'v', (cx + 1) * CW, cy * CH, seen);
      const bd = World.cellRoom.get(cx + ',' + (cy + 1));
      if (bd && bd !== a) scanDoor(a, bd, 'h', cx * CW, (cy + 1) * CH, seen);
    }
  }
}
function scanDoor(a, b, dir, bx, by, seen) {
  let run = -1;
  const n = dir === 'v' ? CH : CW;
  for (let i = 0; i <= n; i++) {
    let open = false;
    if (i < n) {
      if (dir === 'v') open = isPassable(tileAt(bx - 1, by + i)) && isPassable(tileAt(bx, by + i));
      else open = isPassable(tileAt(bx + i, by - 1)) && isPassable(tileAt(bx + i, by));
    }
    if (open && run < 0) run = i;
    if (!open && run >= 0) {
      const id = a.id + '-' + b.id + '-' + dir + (dir === 'v' ? by + run : bx + run);
      if (!seen.has(id)) {
        seen.add(id);
        World.doors.push({ id, a: a.id, b: b.id, dir, tx: dir === 'v' ? bx : bx + run, ty: dir === 'v' ? by + run : by, len: i - run });
      }
      run = -1;
    }
  }
}

/* ---------- collision ---------- */
function tileSolidFor(t, o) {
  if (t === T_SOLID || t === T_CRACK || t === T_MAG || t === T_VOID) return true;
  if (t === T_MEMBRANE) return !(o && o.dash);
  return false;
}
/* returns the first solid rect overlapped by the box, or null */
function boxSolid(x, y, w, h, o) {
  const tx0 = Math.floor(x / TILE), tx1 = Math.floor((x + w - 0.001) / TILE);
  const ty0 = Math.floor(y / TILE), ty1 = Math.floor((y + h - 0.001) / TILE);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (tileSolidFor(tileAt(tx, ty), o)) return { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
  }
  for (const r of World.dyn) {
    if (r.solid && x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y) return r;
  }
  return null;
}
/* one-way surface whose top lies in (prevBottom, newBottom] under the box */
function onewayBelow(x, w, prevBottom, newBottom) {
  const ty = Math.floor((newBottom - 0.001) / TILE), top = ty * TILE;
  if (prevBottom <= top + 0.01 && newBottom > top) {
    const tx0 = Math.floor(x / TILE), tx1 = Math.floor((x + w - 0.001) / TILE);
    for (let tx = tx0; tx <= tx1; tx++) if (tileAt(tx, ty) === T_ONEWAY) return top;

   localStorage may be unavailable (private mode, sandboxed iframes): all
   access is wrapped and the game keeps running without persistence.
   =================================================================== */
const SAVE_KEY = 'duskstation.save.v1', OPT_KEY = 'duskstation.options.v1';
const Store = {
  ok: true,
  read(k) { try { const s = window.localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { this.ok = false; return null; } },
  write(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { this.ok = false; return false; } },

    onGround: true, wasGround: true, coyote: 0, jumpBuf: 0, jumpHeld: false, dropT: 0,

const Player = {
  cx(p) { return p.x + p.w / 2; },
  feet(p) { return p.y + p.h; },
  setCrouch(p, on) {
    if (on === p.crouch) return true;
    if (on) { p.y += PH.H - PH.CH; p.h = PH.CH; p.crouch = true; return true; }
    if (boxSolid(p.x, p.y - (PH.H - PH.CH), p.w, PH.H)) return false;

  update(p, S) {

    p.fireCD = Math.max(0, p.fireCD - dt); p.muzzleT = Math.max(0, p.muzzleT - dt); p.landT = Math.max(0, p.landT - dt);
    p.dashCD = Math.max(0, p.dashCD - dt); p.wjLock = Math.max(0, p.wjLock - dt); p.dropT = Math.max(0, p.dropT - dt);
    p.coyote = Math.max(0, p.coyote - dt); p.jumpBuf = Math.max(0, p.jumpBuf - dt); p.dashBuf = Math.max(0, (p.dashBuf || 0) - dt);

        break;
      case 'move':
        b.open = true; b.y = approach(b.y, b.baseY + bob, 60 * DT);
        moveTo(b.tx, 70 / k);
        if (b.t > 1.15 * k) this.next();
        break;
      /* ---- attack A: claw slam ---- */
      case 'track':
        b.open = false; moveTo(px, 110 / k); b.y = approach(b.y, b.baseY, 60 * DT);
        if (b.t > 0.55 * k) { this.set('slamTell'); Audio.play('tellhi'); }
        break;
      case 'slamTell':
        b.open = false; b.clawY = Math.sin(b.t * 40) * 1;
        if (b.t > 0.75 * k) { this.set('slamDown'); }
        break;
      case 'slamDown': {
        const target = b.floor - (b.y + 14) - 10;
        b.clawY = approach(b.clawY, target, 900 * DT);
        if (b.clawY >= target) {
          Audio.play('slam'); Game.shake(5, 0.3); Game.hitstop(3);
          Fx.dust(b.x, b.floor, 8, 0); Fx.burst(b.x, b.floor - 4, 10, PAL.growthL, 90, 0.4);
          const sp = b.phase === 2 ? 150 : 125;
          for (const d of [-1, 1]) Shots.add({ x: b.x + d * 12, y: b.floor - 5, vx: d * sp, vy: 0, life: 3, friendly: false, dmg: 1, r: 5, wave: true, boss: true, hit: new Set() });
          this.set('slamStuck');
        }
        break;
      }
      case 'slamStuck':
        b.open = true; b.y = approach(b.y, b.baseY, 120 * DT); b.clawY = b.floor - (b.y + 14) - 10;
        if (Math.random() < 0.2) Fx.spark(b.x + rnd(-8, 8), b.floor - 2, PAL.growthL);
        if (b.t > 1.35 * k) this.set('retract');
        break;
      case 'retract':
        b.open = true; b.clawY = approach(b.clawY, 0, 260 * DT); b.y = approach(b.y, b.baseY, 80 * DT);
        if (b.clawY <= 0 && b.t > 0.3) { if (b.queue.length) this.next(); else { this.set('move'); b.tx = clamp(px + rnd(-60, 60), b.L, b.R); } }
        break;
      /* ---- attack B: spore volley ---- */
      case 'sporeTell':
        b.open = false; b.y = approach(b.y, b.baseY + bob, 40 * DT);
        if (b.t > 0.85 * k) {
          for (const mx of b.markers) {
            const sx = b.x + rnd(-10, 10), sy = b.y - 12, T = 0.95 + Math.random() * 0.2, g = 520;
            Shots.add({ x: sx, y: sy, vx: (mx - sx) / T, vy: ((b.floor - 4 - sy) - 0.5 * g * T * T) / T, g, life: 3, friendly: false, dmg: 1, r: 3.5, spore: true, hit: new Set() });
          }
          Audio.play('eshot'); Audio.play('splat'); Fx.burst(b.x, b.y - 12, 10, PAL.growthL, 60, 0.4);
          b.volleys--;
          b.landing = b.markers.slice(); b.landT = 1.3;
          if (b.volleys > 0) { this.setSporeTargets(); b.t = 0.85 * k - 0.6; }
          else { b.markers = []; this.set('vent'); }
        }
        break;
      case 'vent':
        b.open = true;
        if (Math.random() < 0.5) Fx.steam(b.x + rnd(-18, 18), b.y - 10);
        if (b.t > 1.15 * k) { if (b.queue.length) this.next(); else { this.set('move'); b.tx = clamp(px + rnd(-50, 50), b.L, b.R); } }
        break;
      /* ---- attack C: floor charge ---- */
      case 'toWall':
        b.open = false; moveTo(b.tx, 130); b.y = approach(b.y, b.baseY, 60 * DT);
        if (Math.abs(b.x - clamp(b.tx, b.L + 24, b.R - 24)) < 2) { this.set('chargeTell'); Audio.play('roar'); }
        break;
      case 'chargeTell':
        b.open = false; b.y = approach(b.y, b.floor - 16, 150 * DT);
        if (Math.random() < 0.5) Fx.steam(b.x - b.chargeDir * 20, b.y);
        if (b.t > (b.phase === 2 ? 0.75 : 1.1)) this.set('charge');
        break;
      case 'charge': {
        b.open = false; b.y = b.floor - 16;
        b.x += b.chargeDir * (b.phase === 2 ? 285 : 245) * DT;
        if (Math.random() < 0.7) Fx.dust(b.x - b.chargeDir * 20, b.floor, 1, -b.chargeDir);
        const lim = b.chargeDir > 0 ? b.R - 22 : b.L + 22;
        if ((b.chargeDir > 0 && b.x >= lim) || (b.chargeDir < 0 && b.x <= lim)) {
          b.x = lim; Audio.play('slam'); Audio.play('boom'); Game.shake(6, 0.35); Game.hitstop(4);
          Fx.burst(b.x + b.chargeDir * 20, b.y, 14, PAL.growthL, 110, 0.5);
          this.set('dazed');
        }
        break;
      }
      case 'dazed':
        b.open = true; b.y = b.floor - 16 + Math.sin(b.t * 9) * 1;
        if (Math.random() < 0.25) Fx.spark(b.x + rnd(-16, 16), b.y - 14, PAL.stripe);
        if (b.t > 1.3 * k) this.set('rise');
        break;
      case 'rise':
        b.open = true; b.y = approach(b.y, b.baseY, 110 * DT);
        if (b.y <= b.baseY + 0.5) { if (b.queue.length) this.next(); else { this.set('move'); b.tx = clamp(px, b.L, b.R); } }
        break;
      /* ---- phase change & death ---- */
      case 'rage':
        b.open = false; b.y = approach(b.y, b.baseY, 80 * DT); b.clawY = approach(b.clawY, 0, 200 * DT);
        if (Math.random() < 0.5) Fx.burst(b.x + rnd(-20, 20), b.y + rnd(-14, 14), 2, PAL.growthL, 40, 0.5);
        if (b.t > 1.4) { this.set('move'); b.tx = clamp(px, b.L, b.R); }
        break;
      case 'dying':
        b.open = false; b.clawY = approach(b.clawY, 0, 100 * DT);
        if (Math.random() < 0.25) { Fx.explode(b.x + rnd(-20, 20), b.y + rnd(-14, 14), 1, 'boss'); Audio.play('kill'); Game.shake(2, 0.1); }
        if (b.t > 2.6) {
          b.y = approach(b.y, b.floor - 15, 420 * DT);
          if (b.y >= b.floor - 15) { Audio.play('boom'); Game.shake(7, 0.5); Fx.dust(b.x, b.floor, 12, 0); b.wreck = true; b.dead = true; Game.bossDefeated(); }
        }
        break;
    }
    // ---- contact damage
    if (!['dormant', 'dying', 'intro'].includes(b.state) && !b.wreck) {
      if (overlap(p, this.bodyRect())) Player.hurt(p, S, 1, b.x);
      if ((b.state === 'slamDown' || b.state === 'slamTell') && b.clawY > 4 && overlap(p, this.clawRect())) Player.hurt(p, S, 1, b.x);
    }
  },
  wake() {
    const b = this.b;
    if (!b || b.state !== 'dormant') return;
    this.set('intro'); Audio.play('roar'); Audio.play('bossintro'); Game.shake(4, 0.6);
    Audio.bossOn = true;
  },
  /* returns 'hit' | 'deflect' | 'none' */
  hit(shot, S) {
    const b = this.b;
    if (!b || b.dead || b.wreck) return 'none';
    const s = { x: shot.x - shot.r, y: shot.y - shot.r, w: shot.r * 2, h: shot.r * 2 };
    const onCore = overlap(s, this.coreRect()), onBody = overlap(s, this.bodyRect()) || (b.clawY > 4 && overlap(s, this.clawRect()));
    if (!onCore && !onBody) return 'none';
    if (b.state === 'dormant' || b.state === 'dying') return 'deflect';
    if (onCore && b.open) {
      b.hp -= shot.dmg; b.flash = 0.08; b.hurtT = 0.12;
      Fx.hit(shot.x, shot.y, shot.charged); Audio.play('hit');
      if (shot.charged) Game.hitstop(3);
      if (b.phase === 1 && b.hp <= b.maxHp / 2) {
        b.phase = 2; b.queue = []; this.set('rage'); Audio.play('roar'); Game.shake(5, 0.6); Game.flash(6);
      }
      if (b.hp <= 0) { b.hp = 0; this.set('dying'); b.markers = []; Audio.bossOn = false; Game.hitstop(12); Audio.play('boom'); }
      return 'hit';
    }
    Audio.play('deflect'); Fx.spark(shot.x, shot.y, '#ffffff');
    return 'deflect';
  }
};
/* ============================== OBJECTS ==============================
   Projectiles, particles, pickups and interactive world objects.
   ==================================================================== */
const shotBox = s => ({ x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 });
const Shots = {
  list: [],
  add(s) { s.age = 0; this.list.push(s); if (this.list.length > 90) this.list.shift(); },
  clear() { this.list = []; },
  update(S) {
    for (const s of this.list) {
      if (s.dead) continue;
      s.age += DT; s.life -= DT;
      if (s.g) s.vy += s.g * DT;
      if (s.puff) { if (s.life <= 0) s.dead = true; else this.hitPlayer(s, S); continue; }
      const steps = Math.max(1, Math.ceil(Math.hypot(s.vx, s.vy) * DT / 3));
      for (let i = 0; i < steps && !s.dead; i++) {
        s.x += s.vx * DT / steps; s.y += s.vy * DT / steps;
        this.collide(s, S);
      }
      if (s.wave && !s.dead) {
        // shockwaves die where the floor ends
        const below = tileAt(Math.floor(s.x / TILE), Math.floor((s.y + 7) / TILE));
        if (!tileSolidFor(below)) s.dead = true;
        if (Math.random() < 0.5) Fx.dust(s.x, s.y + 5, 1, sign(s.vx));
      }
      if (s.life <= 0 && !s.dead) { s.dead = true; if (s.spore) this.burst(s); }
    }
    this.list = this.list.filter(s => !s.dead);
  },
  hitPlayer(s, S) {
    const p = S.player;
    if (!p.dead && overlap(shotBox(s), p)) return Player.hurt(p, S, s.dmg, s.x - (s.vx || 0) * 0.1);
    return false;
  },
  burst(s) {
    s.dead = true;
    Audio.play('splat'); Fx.splat(s.x, s.y + 2);
    this.add({ x: s.x, y: s.y - 2, vx: 0, vy: 0, r: 9, life: 0.28, friendly: false, dmg: 1, puff: true, hit: new Set() });
  },
  collide(s, S) {
    const t = pointSolid(s.x, s.y);
    if (t) {
      if (s.spore) { this.burst(s); return; }
      s.dead = true;
      if (s.wave) { Fx.dust(s.x, s.y + 4, 3, 0); return; }
      if (s.friendly && t === T_CRACK) { Objects.crack(Math.floor(s.x / TILE), Math.floor(s.y / TILE), s.charged ? 9 : 1, S); }
      else if (s.friendly && t === T_MEMBRANE) { Fx.burst(s.x, s.y, 3, PAL.lurkL, 30, 0.3); Audio.play('splat'); }
      Fx.spark(s.x - sign(s.vx) * 2, s.y - sign(s.vy) * 2, s.friendly ? PAL.pE : PAL.hazardL);
      if (s.friendly) Audio.play('crack');
      return;
    }
    if (s.friendly) {
      const b = shotBox(s);
      for (const e of Enemies.list) {
        if (e.dead || s.hit.has(e) || !overlap(b, e)) continue;
        const r = Enemies.hit(e, s, S);
        if (r === 'deflect') { s.dead = true; return; }
        if (r !== 'none') { s.hit.add(e); if (!s.charged) { s.dead = true; return; } }
      }
      if (Boss.b && !Boss.b.wreck && !s.hit.has(Boss)) {
        const r = Boss.hit(s, S);
        if (r === 'deflect') { s.dead = true; return; }
        if (r === 'hit') { s.hit.add(Boss); if (!s.charged) { s.dead = true; return; } }
      }
      for (const h of this.list) {
        if (h.friendly || h.dead || h.wave || h.puff) continue;
        if (dist2(s.x, s.y, h.x, h.y) < (s.r + h.r + 1.5) ** 2) {
          if (h.spore) this.burst(h); else { h.dead = true; Fx.spark(h.x, h.y, PAL.hazardL); Audio.play('crack'); }
          if (!s.charged) { s.dead = true; return; }
        }
      }
    } else if (this.hitPlayer(s, S) || overlap(shotBox(s), S.player)) {
      if (!s.wave) { if (s.spore) this.burst(s); else { s.dead = true; Fx.spark(s.x, s.y, PAL.hazardL); } }
    }
  }
};

/* ---------------- particles ---------------- */
const Fx = {
  list: [], cap: 300,
  add(p) {
    if (this.list.length >= this.cap) { const i = this.list.findIndex(q => q.amb); this.list.splice(i >= 0 ? i : 0, 1); }
    p.max = p.life; this.list.push(p);
  },
  clear() { this.list = this.list.filter(p => false); },
  dust(x, y, n, dir) { for (let i = 0; i < n; i++) this.add({ x: x + rnd(-3, 3), y: y - 1, vx: dir * rnd(10, 30) + rnd(-18, 18), vy: rnd(-22, -4), g: 30, life: rnd(0.25, 0.5), col: '#b9ad9a', col2: '#6f6556', k: 'dust' }); },
  burst(x, y, n, col, sp, life) { for (let i = 0; i < n; i++) { const a = rnd(Math.PI * 2), v = rnd(sp * 0.3, sp); this.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 120, life: rnd(life * 0.5, life), col, k: 'px' }); } },
  spark(x, y, col) { for (let i = 0; i < 3; i++) { const a = rnd(Math.PI * 2), v = rnd(30, 90); this.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 200, life: rnd(0.08, 0.22), col, k: 'px' }); } },
  ring(x, y, col) { this.add({ x, y, vx: 0, vy: 0, life: 0.22, col, k: 'ring', r0: 2, r1: 11 }); },
  muzzle(x, y, dx, dy, big) {
    this.add({ x, y, vx: 0, vy: 0, life: big ? 0.1 : 0.06, col: '#ffffff', k: 'flash', r0: big ? 5 : 3, dx, dy });
    for (let i = 0; i < (big ? 6 : 2); i++) this.add({ x, y, vx: dx * rnd(40, 110) + rnd(-25, 25), vy: dy * rnd(40, 110) + rnd(-25, 25), life: rnd(0.06, 0.15), col: PAL.pE, k: 'px' });
  },
  hit(x, y, big) {
    this.add({ x, y, vx: 0, vy: 0, life: big ? 0.12 : 0.07, col: '#ffffff', k: 'flash', r0: big ? 6 : 3 });
    this.burst(x, y, big ? 9 : 4, big ? PAL.pE : '#ffe8b0', big ? 120 : 80, 0.25);
  },
  explode(x, y, size, type) {
    const cols = { crawler: [PAL.crawlerL, PAL.crawler], drone: [PAL.droneL, PAL.eyeAmber], lurker: [PAL.lurkL, PAL.lurk], sentinel: [PAL.shieldL, PAL.core], warden: [PAL.shieldL, PAL.core], boss: [PAL.growthL, PAL.stripe] }[type] || ['#fff', '#fa0'];
    this.add({ x, y, vx: 0, vy: 0, life: 0.12 * size, col: '#ffffff', k: 'flash', r0: 7 * size });
    this.add({ x, y, vx: 0, vy: 0, life: 0.3, col: cols[0], k: 'ring', r0: 3, r1: 16 * size });
    for (let i = 0; i < 12 * size; i++) { const a = rnd(Math.PI * 2), v = rnd(30, 130); this.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 220, life: rnd(0.3, 0.7), col: i % 2 ? cols[0] : cols[1], k: i % 3 ? 'px' : 'chunk' }); }
    for (let i = 0; i < 4 * size; i++) this.add({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-10, 10), vy: rnd(-25, -8), life: rnd(0.5, 1.0), col: '#3a3344', k: 'smoke' });
  },
  drip(x, y, col) { this.add({ x, y, vx: 0, vy: 20, g: 420, life: 0.8, col, k: 'drip' }); },
  splat(x, y) { for (let i = 0; i < 10; i++) { const a = -Math.PI * rnd(0.05, 0.95), v = rnd(30, 100); this.add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 300, life: rnd(0.25, 0.5), col: i % 2 ? PAL.lurkL : PAL.lurk, k: 'px' }); } },
  splash(x, y) { for (let i = 0; i < 6; i++) this.add({ x: x + rnd(-4, 4), y, vx: rnd(-35, 35), vy: rnd(-70, -30), g: 400, life: rnd(0.25, 0.45), col: '#9fe8e4', k: 'px' }); },
  steam(x, y) { this.add({ x: x + rnd(-2, 2), y, vx: rnd(-8, 8), vy: rnd(-30, -15), life: rnd(0.5, 0.9), col: '#cfc6d8', k: 'smoke', amb: true }); },
  update() {
    for (const p of this.list) {
      p.life -= DT;
      if (p.g) p.vy += p.g * DT;
      p.x += p.vx * DT; p.y += p.vy * DT;
      if (p.k === 'drip' && pointSolid(p.x, p.y + 1)) { p.life = 0; if (Math.random() < 0.7) this.add({ x: p.x, y: p.y - 1, vx: 0, vy: 0, life: 0.18, col: p.col, k: 'plink', amb: true }); }
      if (p.k === 'spore') { p.vx += Math.sin(Game.time * 0.9 + p.seed) * 3 * DT; }
      if (p.k === 'dust' || p.k === 'chunk') { if (pointSolid(p.x, p.y + 1) && p.vy > 0) { p.vy *= -0.3; p.vx *= 0.6; } }
    }
    this.list = this.list.filter(p => p.life > 0);
  }
};

/* ---------------- pickups ---------------- */
const Pickups = {
  list: [],
  add(x, y, kind) { this.list.push({ x, y, vx: rnd(-40, 40), vy: -110, kind, life: 9, t: 0 }); },
  clear() { this.list = []; },
  update(S) {
    const p = S.player, pcx = Player.cx(p), pcy = p.y + p.h / 2;
    for (const k of this.list) {
      k.t += DT; k.life -= DT;
      const d = Math.hypot(pcx - k.x, pcy - k.y);
      if (d < 34 && !p.dead) {
        // modest attraction at close range
        k.vx = lerp(k.vx, (pcx - k.x) * 6, 0.18); k.vy = lerp(k.vy, (pcy - k.y) * 6, 0.18);
      } else {
        k.vy = Math.min(200, k.vy + 500 * DT);
        k.vx *= 0.98;
      }
      const b = { x: k.x - 3, y: k.y - 3, w: 6, h: 6 };
      if (moveX(b, k.vx * DT)) k.vx *= -0.4;
      if (moveY(b, k.vy * DT)) { k.vy *= -0.35; k.vx *= 0.7; }
      k.x = b.x + 3; k.y = b.y + 3;
      if (d < 9 && !p.dead) {
        k.life = 0;
        if (k.kind === 'heal') p.hp = Math.min(p.maxHp, p.hp + 1); else p.energy = Math.min(p.maxEnergy, p.energy + 1);
        Audio.play('pickup'); Fx.ring(k.x, k.y, k.kind === 'heal' ? PAL.heal : PAL.energy);
      }
    }
    this.list = this.list.filter(k => k.life > 0);
  }
};

/* ---------------- interactive world objects ---------------- */
const Objects = {
  list: [], crackHP: {},
  init() {
    this.list = [];
    for (const room of World.rooms) for (const d of (room.def.obj || [])) {
      const o = Object.assign({}, d, { room, gx: room.tx + d.x, gy: room.ty + d.y, tm: 0, openT: 0 });
      o.px = o.gx * TILE; o.py = o.gy * TILE;
      if (o.t === 'gate') { o.ww = (o.w || 1) * TILE; o.hh = o.h * TILE; }
      if (o.t === 'hatch') { o.ww = o.w * TILE; o.hh = TILE; }
      this.list.push(o);
    }
  },
  get(id) { return this.list.find(o => o.id === id); },
  isOpen(o, S) {
    const f = S.flags;
    if (o.t === 'gate') {
      if (o.mode === 'from:right') return !!f['door:' + o.id];
      if (o.mode.startsWith('flag:')) return !!f[o.mode.slice(5)];
      if (o.mode === 'warden') return !Game.wardenFight;
      if (o.mode === 'boss') return !Boss.active();
    }
    if (o.t === 'hatch') {
      if (o.mode === 'below') return !!f['door:' + o.id];
      if (o.mode.startsWith('flag:')) return !!f[o.mode.slice(5)];
    }
    return true;
  },
  /* rebuild dynamic solids from door states */
  refreshDyn(S) {
    World.dyn = [];
    for (const o of this.list) {
      if (o.t !== 'gate' && o.t !== 'hatch') continue;
      const open = this.isOpen(o, S);
      if (o.t === 'gate') { if (o.openT < 0.98) World.dyn.push({ x: o.px, y: o.py, w: o.ww, h: o.hh * (1 - o.openT), solid: true, o }); }
      else if (!open) World.dyn.push({ x: o.px, y: o.py, w: o.ww, h: TILE, solid: true, o });
      else if (o.mode === 'below') World.dyn.push({ x: o.px, y: o.py, w: o.ww, h: 2, oneway: true, o });
    }
  },
  update(S) {
    const p = S.player, pcx = Player.cx(p), pcy = p.y + p.h / 2, f = S.flags;
    Game.interactTarget = null;
    let best = 1e9;
    for (const o of this.list) {
      o.tm += DT;
      const near = (r) => Math.abs(pcx - (o.px + 4)) < r && Math.abs((p.y + p.h) - (o.py + 8)) < 18;
      switch (o.t) {
        case 'gate': {
          if (o.mode === 'from:right' && !f['door:' + o.id] && pcx > o.px + o.ww && pcx - (o.px + o.ww) < 40 && p.y + p.h > o.py && p.y < o.py + o.hh + 8) {
            f['door:' + o.id] = true; Game.toast('SHORTCUT OPENED'); Audio.play('door'); Audio.play('shortcut'); Game.save();
          }
          const open = this.isOpen(o, S), was = o.openT;
          if (open) o.openT = Math.min(1, o.openT + DT * 2.4);
          else {
            const r = { x: o.px, y: o.py, w: o.ww, h: o.hh };
            if (!overlap(p, r)) o.openT = Math.max(0, o.openT - DT * 3);
            else p.x = pcx < o.px + o.ww / 2 ? o.px - p.w : o.px + o.ww; // never trap the player inside a door

/* ---- value noise for silhouettes ---- */
function noise1(rng, n, period) {
  const pts = []; for (let i = 0; i <= Math.ceil(n / period) + 1; i++) pts.push(rng());

    const top = Math.round(base - v * amp);

    if (rim) pb.set(x, top, rim);

/* ---------------- mid layer ---------------- */

/* ---------------- back wall (parallax 1.0) ---------------- */

/* ---------------- light shafts ---------------- */

        // tracks
        pb.rect(x0 + 4, by - 13, x1 - x0 - 8, 13, '#17121d');
        for (let wx = x0 + 10; wx < x1 - 6; wx += 14) { pb.disc(wx, by - 7, 5, '#2a2330'); pb.disc(wx, by - 7, 2, '#4a3e52'); }
        pb.rect(x0 + 4, by - 14, x1 - x0 - 8, 1, '#3b3046');
        // hull
        pb.rect(x0, by - 40, x1 - x0 - 34, 26, body);
        pb.rect(x0, by - 40, x1 - x0 - 34, 1, rim);
        for (let px = x0 + 12; px < x1 - 40; px += 18) pb.rect(px, by - 39, 1, 25, bodyD);
        pb.rect(x0 + 3, by - 30, 40, 9, bodyD); pixText(pb, 'SURVEY 3', x0 + 6, by - 28, '#6a5a72');
        // cab with cracked windshield
        pb.rect(x1 - 34, by - 52, 30, 38, bodyL); pb.rect(x1 - 34, by - 52, 30, 1, rim);
        for (let j = 0; j < 14; j++) for (let i = 0; i < 18 - Math.floor(j / 2); i++) pb.set(x1 - 28 + i + Math.floor(j / 2), by - 48 + j, bayer(i, j) < 0.2 ? '#2d6f73' : '#14393f');
        pb.line(x1 - 22, by - 47, x1 - 14, by - 38, '#6fb8b0'); pb.line(x1 - 18, by - 43, x1 - 24, by - 36, '#6fb8b0');
        // mast
        for (let k = 0; k < 30; k++) pb.set(x0 + 30 + Math.floor(k / 6), by - 41 - k, '#3b3046');
        pb.rect(x0 + 33, by - 74, 7, 2, '#3b3046');
        // vines draped over everything
        for (let i = 0; i < 26; i++) { const vx = x0 + Math.floor(rng() * (x1 - x0)); vineStrand(pb, vx, by - 52 + Math.floor(rng() * 12), 8 + Math.floor(rng() * 26), reg, rng); }
        for (let i = x0; i < x1 - 34; i++) if (rng() < 0.7) pb.set(i, by - 41, rng() < 0.5 ? reg.flora[2] : reg.flora[1]);
        break;
      }
      case 'lander': {
        const cx = X, by = Y;
        const hull = '#b9b1a0', hullD = '#857c6c', hullL = '#d9d2c2', stripe = '#b35428';
        pb.line(cx - 30, by - 1, cx - 20, by - 16, '#4a443e'); pb.line(cx + 30, by - 1, cx + 20, by - 16, '#4a443e');
        pb.rect(cx - 33, by - 2, 7, 2, '#4a443e'); pb.rect(cx + 26, by - 2, 7, 2, '#4a443e');
        for (let j = 0; j < 22; j++) { const hw = Math.round(28 - Math.abs(j - 12) * 0.9); pb.rect(cx - hw, by - 38 + j, hw * 2, 1, j < 3 ? hullL : j > 17 ? hullD : hull); }
        pb.rect(cx - 26, by - 26, 52, 2, stripe);
        pb.rect(cx - 6, by - 36, 14, 6, '#0d3a3d'); pb.rect(cx - 5, by - 35, 4, 1, '#48c4b6');
        pb.rect(cx + 14, by - 22, 10, 6, hullD); pb.line(cx + 14, by - 16, cx + 26, by - 1, hullD); pb.line(cx + 15, by - 16, cx + 27, by - 1, hullL);
        pb.rect(cx - 2, by - 44, 1, 7, '#4a443e'); pb.set(cx - 2, by - 45, '#ff7a3c');
        pixText(pb, 'DS-7', cx - 22, by - 23, '#5b4f44');
        break;
      }
      case 'vines': vineStrand(pb, X + 3, Y, d.len * TILE, reg, rng); vineStrand(pb, X + 5, Y, Math.floor(d.len * TILE * 0.6), reg, rng); break;
      case 'sign': {
        const w = d.text.length * 4 + 5;
        pb.rect(X - 1, Y - 1, w + 2, 9, PAL.ink); pb.rect(X, Y, w, 7, r.reg === 'C' ? '#2a1414' : '#1d1828'); pb.rect(X, Y, w, 1, reg.metL);
        pixText(pb, d.text, X + 3, Y + 1, reg.accent);
        break;
      }
      case 'stairsign': pb.rect(X - 1, Y - 18, 13, 9, PAL.ink); pb.rect(X, Y - 17, 11, 7, '#1d1828'); pixText(pb, 'UP', X + 2, Y - 16, reg.accent); pb.set(X + 10, Y - 15, reg.accent); break;
      case 'rail': {
        if (d.boss) { pb.rect(X, Y, d.w * TILE, 4, '#3a2a2a'); pb.rect(X, Y, d.w * TILE, 1, '#7a4a31'); pb.rect(X, Y + 3, d.w * TILE, 1, '#140b0c'); for (let i = 0; i < d.w * TILE; i += 12) pb.set(X + i, Y + 1, '#ff8a3c'); break; }
        for (let i = 0; i <= d.w * TILE; i += 6) pb.rect(X + i, Y + 2, 1, 6, reg.metL);
        pb.rect(X, Y + 1, d.w * TILE, 1, reg.metH); pb.rect(X, Y + 4, d.w * TILE, 1, reg.metD);
        break;
      }
      case 'liftcage': {
        const x0 = X - 20, y0 = Y - 40;
        pb.rect(x0, y0, 40, 2, reg.metL); pb.rect(x0, Y - 2, 40, 2, reg.metL);
        for (let i = 0; i <= 40; i += 5) pb.rect(x0 + i, y0, 1, 40, d.broken && i > 20 && i < 32 ? reg.wallD : reg.metD);
        if (d.broken) pb.line(x0 + 22, y0 + 2, x0 + 34, Y - 4, reg.metL);
        pb.rect(x0 + 18, y0 - 30, 2, 30, reg.metD);
        pb.rect(x0 + 6, y0 + 6, 3, 3, r.reg === 'C' ? '#ff4f2a' : '#ffb347');
        break;
      }
      case 'machine': {
        const w = d.w * TILE, h = d.h * TILE, x0 = X - w / 2, y0 = Y - h;
        pb.rect(x0, y0, w, h, reg.metD); pb.rect(x0, y0, w, 1, reg.metL); pb.rect(x0 + 2, y0 + 3, w - 4, 4, reg.wallL);
        for (let i = 4; i < w - 4; i += 6) pb.rect(x0 + i, y0 + 10, 3, h - 14, reg.wall);
        pb.set(x0 + 4, y0 + 4, '#ff5a3c');
        for (let i = 0; i < w; i++) if (rng() < 0.4) { const hh = 1 + Math.floor(rng() * 4); for (let k = 0; k < hh; k++) pb.set(x0 + i, y0 - k, k === hh - 1 ? reg.flora[3] : reg.flora[2]); }
        for (let i = 0; i < 5; i++) vineStrand(pb, x0 + Math.floor(rng() * w), y0, 6 + Math.floor(rng() * 12), reg, rng);
        break;
      }
      case 'pipe': {
        const horiz = d.w > 1, len = (horiz ? d.w : d.h) * TILE;
        for (let i = 0; i < len; i++) {
          const px = horiz ? X + i : X + 2, py = horiz ? Y + 2 : Y + i;
          if (horiz) { pb.set(px, py, reg.metH); pb.set(px, py + 1, reg.metL); pb.set(px, py + 2, reg.met); pb.set(px, py + 3, reg.metD); }
          else { pb.set(px, py, reg.metH); pb.set(px + 1, py, reg.metL); pb.set(px + 2, py, reg.met); pb.set(px + 3, py, reg.metD); }
          if (i % 24 === 0) { if (horiz) pb.rect(px, py - 1, 2, 6, reg.metL); else pb.rect(px - 1, py, 6, 2, reg.metL); }
        }
        break;
      }
      case 'girder': for (let i = 0; i < d.w * TILE; i++) { pb.set(X + i, Y, reg.wallL); pb.set(X + i, Y + 6, reg.wallL); if (i % 8 < 1) pb.line(X + i, Y, X + i + 6, Y + 6, reg.wallH); } break;
      case 'tank': {
        const x0 = X - 10, y0 = Y - 40;
        pb.rect(x0, Y - 4, 20, 4, reg.metL); pb.rect(x0, y0, 20, 3, reg.metL); pb.rect(x0, y0 + 3, 20, 1, reg.metD);
        for (let j = y0 + 4; j < Y - 4; j++) for (let i = x0 + 1; i < x0 + 19; i++) {
          if (d.broken) { if (j > Y - 10 && bayer(i, j) < 0.5) pb.set(i, j, '#163f48'); }
          else pb.set(i, j, bayer(i, j) < 0.25 ? '#1f6e74' : '#123f4a');
        }
        if (!d.broken) { for (let j = 0; j < 14; j++) pb.rect(x0 + 7 + Math.round(Math.sin(j * 0.6) * 2), y0 + 10 + j, 5, 1, '#0a2228'); pb.rect(x0 + 2, y0 + 6, 1, 26, '#6fd6cf'); }
        else { pb.line(x0 + 2, y0 + 4, x0 + 6, y0 + 12, '#8fb8c0'); pb.line(x0 + 16, y0 + 4, x0 + 13, y0 + 16, '#8fb8c0'); }
        break;
      }
      case 'bench': pb.rect(X - 12, Y - 9, 24, 2, reg.metL); pb.rect(X - 11, Y - 7, 2, 7, reg.metD); pb.rect(X + 9, Y - 7, 2, 7, reg.metD); pb.rect(X - 8, Y - 13, 6, 4, reg.met); pb.set(X - 6, Y - 12, '#62d6d0'); pb.rect(X + 2, Y - 15, 3, 6, '#1d7484'); break;
      case 'locker': pb.rect(X - 6, Y - 22, 12, 22, reg.met); pb.rect(X - 6, Y - 22, 12, 1, reg.metL); pb.rect(X, Y - 22, 1, 22, reg.metD); pb.set(X - 2, Y - 12, reg.metH); pb.set(X + 2, Y - 12, reg.metH); break;
      case 'plant': pb.rect(X - 4, Y - 6, 8, 6, reg.metL); for (let i = 0; i < 9; i++) vineStrand(pb, X - 4 + i, Y - 14 + (i % 3), 8, reg, rng); break;
      case 'pedestal': {
        if (d.dais) { pb.rect(X - 30, Y - 1, 60, 1, reg.trim); }
        pb.rect(X - 7, Y - 5, 16, 5, reg.metL); pb.rect(X - 5, Y - 7, 12, 2, reg.metH); pb.rect(X - 7, Y - 1, 16, 1, reg.metD);
        pb.rect(X - 1, Y - 4, 4, 2, '#62d6d0');
        break;
      }
      case 'pump': {
        const x0 = X - 16, y0 = Y - 30;
        pb.rect(x0, y0, 32, 30, reg.wallL); pb.disc(X, y0 + 13, 10, reg.metD); pb.disc(X, y0 + 13, 7, reg.wall); pb.disc(X, y0 + 13, 2, reg.metL);
        for (let a = 0; a < 6; a++) pb.line(X, y0 + 13, X + Math.round(Math.cos(a) * 7), y0 + 13 + Math.round(Math.sin(a) * 7), reg.metD);
        pb.rect(x0, y0, 32, 1, reg.metL); pb.rect(x0 + 4, y0 + 26, 24, 2, reg.trim);
        break;
      }
      case 'chain': for (let k = 0; k < d.len * TILE; k++) pb.set(X + 3 + (k % 4 < 2 ? 0 : 1), Y + k, k % 4 === 0 ? reg.metD : reg.metL); break;
      case 'console': pb.rect(X - 10, Y - 12, 20, 12, reg.met); pb.rect(X - 10, Y - 12, 20, 1, reg.metL); pb.rect(X - 8, Y - 10, 16, 5, '#1a0d0d'); for (let i = 0; i < 4; i++) pb.set(X - 6 + i * 4, Y - 3, i % 2 ? '#ff8a3c' : '#5fe8cf'); break;
      case 'coresign': {
        pb.rect(X - 14, Y, 36, 13, PAL.ink); pb.rect(X - 13, Y + 1, 34, 11, '#2a1414');
        for (let i = 0; i < 34; i++) pb.set(X - 13 + i, Y + 1, i % 6 < 3 ? PAL.stripe : '#2a1414');
        pixText(pb, 'CORE', X - 4, Y + 5, '#ff8a3c');
        break;
      }
      case 'magsign': pb.rect(X - 8, Y - 30, 17, 9, PAL.ink); pb.rect(X - 7, Y - 29, 15, 7, '#1d1b2e'); pixText(pb, 'MAG', X - 6, Y - 28, '#7fd8f0'); break;
      case 'scope': pb.rect(X - 2, Y - 14, 4, 14, reg.metD); pb.line(X - 8, Y - 20, X + 10, Y - 13, reg.metL); pb.line(X - 8, Y - 19, X + 10, Y - 12, reg.met); pb.rect(X - 6, Y - 2, 12, 2, reg.metL); break;
      case 'flora': for (let i = -8; i < 8; i++) { const hh = 3 + Math.floor(rng() * 7); for (let k = 0; k < hh; k++) pb.set(X + i, Y - k - 1, k === hh - 1 ? reg.flora[3] : reg.flora[1]); } break;
      case 'reactorgate': {
        const x0 = X - 4, y0 = Y - 56, w = 7 * TILE + 4, h = 56;
        pb.rect(x0 - 3, y0 - 3, w + 6, 3, PAL.ink); pb.rect(x0 - 3, y0, 3, h, PAL.ink);
        for (let i = 0; i < w + 6; i++) pb.set(x0 - 3 + i, y0 - 2, ((i >> 2) % 2) ? PAL.stripe : '#2a2030');
        for (let j = 0; j < h; j++) { pb.set(x0 - 2, y0 + j, ((j >> 2) % 2) ? PAL.stripe : '#2a2030'); pb.set(x0 - 1, y0 + j, reg.metD); }
        pb.rect(x0, y0, w, h, '#1a0c0c');
        for (let j = 0; j < h; j += 6) pb.rect(x0, y0 + j, w, 1, '#2a1210');
        pb.rect(x0 + 8, y0 - 16, 46, 11, PAL.ink); pb.rect(x0 + 9, y0 - 15, 44, 9, '#2a1414'); pixText(pb, 'REACTOR', x0 + 17, y0 - 13, '#ff8a3c');
        break;
      }
      case 'brokenwalk': {
        const s = d.flip ? -1 : 1, bx = d.flip ? X - 1 : X + 8;
        for (let k = 0; k < 14; k++) { pb.set(bx + s * Math.floor(k * 0.45), Y + 1 + k, k % 3 ? reg.metL : reg.metD); pb.set(bx + s * (Math.floor(k * 0.45) + 1), Y + 1 + k, reg.metD); }
        for (let k = 0; k < 8; k++) pb.set(bx + s * (2 + k), Y + 2 + Math.floor(k * 1.2), reg.metD);
        break;
      }
      case 'liftshaft': if (!d.surface) for (let y = 0; y < 19 * TILE; y++) { pb.set(X + 8, y, reg.metD); pb.set(X + 64, y, reg.metD); } else { pb.rect(X - 4, 0, 4, 19 * TILE, reg.rockD); pb.rect(X + 40, 2 * TILE, 4, 17 * TILE, reg.metD); pb.rect(X - 4, 2 * TILE, 48, 3, reg.metL); } break;
    }
  }
}

/* ------------------- animated scenery (per frame) ------------------- */
const DecorFx = {
  /* drawn before the back wall: things seen through holes in it */
  behind(ctx, r, ox, oy, t) {
    const reg = REG[r.reg], S = Game.S;
    for (const d of r.def.deco || []) {
      const X = ox + d.x * TILE, Y = oy + d.y * TILE;
      if (d.k === 'glass') this.specimen(ctx, X, Y, d.w * TILE, d.h * TILE, t);
      else if (d.k === 'window' && d.aqua) { ditherFill(ctx, '#0a2a36', 16, X, Y, d.w * TILE, d.h * TILE); ditherFill(ctx, '#174a58', 5, X, Y, d.w * TILE, d.h * TILE); for (let i = 0; i < 6; i++) { const bx = X + ((i * 37 + t * 9) % (d.w * TILE)), by = Y + d.h * TILE - ((t * 14 + i * 23) % (d.h * TILE)); ctx.fillStyle = '#4fb6b8'; ctx.fillRect(Math.round(bx), Math.round(by), 1, 1); } }
      else if (d.k === 'window' && d.reactor) { ditherFill(ctx, '#2a0e08', 16, X, Y, d.w * TILE, d.h * TILE); this.reactorGlow(ctx, X + d.w * 4, Y + d.h * 8 + 6, 18, t); }
      else if (d.k === 'reactorview') this.reactorVista(ctx, X, Y, d.w * TILE, d.h * TILE, t);
      else if (d.k === 'corebg') this.coreSphere(ctx, ox + 19.5 * TILE, oy + 11 * TILE, t);
      else if (d.k === 'liftshaft' && !d.surface) {
        ditherFill(ctx, '#0a0505', 16, X + 9, oy, 55, 19 * TILE);
        const on = S && S.flags.boss;
        for (let i = 0; i < 8; i++) { const ly = oy + ((i * 23 + (on ? t * 40 : 0)) % (19 * TILE)); ctx.fillStyle = on ? '#5fe8cf' : '#3a1a14'; ctx.fillRect(X + 10, Math.round(ly), 2, 1); ctx.fillRect(X + 61, Math.round(ly), 2, 1); }
      }
    }
  },
  reactorGlow(ctx, cx, cy, R, t) {
    const S = Game.S, calm = S && S.flags.boss, woke = S && S.flags.core;
    const pulse = 0.5 + 0.5 * Math.sin(t * (woke ? 1.6 : 0.7));
    const cols = calm ? ['#123a3a', '#1f6a62', '#3fb8a2', '#bff8ea'] : ['#4a1a0e', '#8a3412', '#d8642a', '#ffd890'];
    for (let k = 0; k < 4; k++) {
      const rr = Math.round(R * (1 - k * 0.22) * (0.92 + pulse * 0.08));
      const lv = k === 3 ? 10 + Math.round(pulse * 6) : 6 + k * 3;
      ctx.fillStyle = ditherPattern(ctx, cols[k], lv);
      ctx.beginPath();
      // pixel-stepped disc built from rect rows (no anti-aliasing)
      for (let j = -rr; j <= rr; j++) { const hw = Math.floor(Math.sqrt(rr * rr - j * j)); ctx.rect(Math.round(cx - hw), Math.round(cy + j), hw * 2, 1); }
      ctx.fill();
    }
  },
  reactorVista(ctx, X, Y, W, H, t) {
    const S = Game.S, calm = S && S.flags.boss, woke = S && S.flags.core;
    const cx = Math.round(X + W / 2), cy = Math.round(Y + H * 0.74), R = 74;
    // support struts and distant gantries
    ctx.fillStyle = '#1c0d0b';
    for (const dx of [-64, -30, 30, 64]) ctx.fillRect(cx + dx - 3, Y, 6, H);
    for (let y = Y + 20; y < Y + H; y += 46) ctx.fillRect(X, y, W, 3);
    // sphere body
    for (let j = -R; j <= R; j++) { const hw = Math.floor(Math.sqrt(R * R - j * j)); ctx.fillStyle = j < -R * 0.4 ? '#2a120e' : '#1e0c0a'; ctx.fillRect(cx - hw, cy + j, hw * 2, 1); }
    // glowing bands that wake over the course of the game
    const pulse = 0.5 + 0.5 * Math.sin(t * (woke ? 1.8 : 0.6));
    const band = calm ? '#3fb8a2' : woke ? '#ff8a3c' : '#a8401a', hot = calm ? '#bff8ea' : '#ffd890';
    for (let b = -2; b <= 2; b++) {
      const by = cy + b * 22, hw = Math.floor(Math.sqrt(Math.max(0, R * R - (b * 22) ** 2)));
      ctx.fillStyle = ditherPattern(ctx, band, 8 + Math.round(pulse * 6)); ctx.fillRect(cx - hw, by - 1, hw * 2, 3);
      if (b === 0) { ctx.fillStyle = ditherPattern(ctx, hot, 4 + Math.round(pulse * 8)); ctx.fillRect(cx - hw + 6, by, hw * 2 - 12, 1); }
    }
    this.reactorGlow(ctx, cx, cy, 30, t);
    // energy arcs crawling over the shell
    ctx.fillStyle = hot;
    for (let k = 0; k < 3; k++) { const a = t * (0.4 + k * 0.17) + k * 2.1; ctx.fillRect(Math.round(cx + Math.cos(a) * (R - 3)), Math.round(cy + Math.sin(a) * (R - 3) * 0.45), 2, 1); }
  },
  coreSphere(ctx, cx, cy, t) {
    const S = Game.S, calm = S && S.flags.boss;
    ditherFill(ctx, '#0b0405', 16, cx - 200, cy - 100, 400, 200);
    this.reactorGlow(ctx, cx, cy + 4, 58, t);
    ctx.fillStyle = calm ? '#1f6a62' : '#5a2410';
    for (let a = 0; a < 64; a++) { const ang = a / 64 * Math.PI * 2 + t * 0.15; ctx.fillRect(Math.round(cx + Math.cos(ang) * 74), Math.round(cy + 4 + Math.sin(ang) * 22), 2, 1); }
  },
  specimen(ctx, X, Y, W, H, t) {
    ditherFill(ctx, '#06161e', 16, X, Y, W, H);
    ditherFill(ctx, '#0d2c38', 6, X, Y, W, H * 0.6);
    // caustic light rays
    ctx.fillStyle = ditherPattern(ctx, '#1d5560', 2);
    for (let i = 0; i < 4; i++) { const rx = X + ((i * 61 + t * 6) % W); ctx.beginPath(); ctx.moveTo(rx, Y); ctx.lineTo(rx + 10, Y); ctx.lineTo(rx + 34, Y + H); ctx.lineTo(rx + 20, Y + H); ctx.fill(); }
    // the giant organism: a long segmented body drifting past the glass
    const period = 17, ph = ((t + 6) % period) / period;
    const headX = X - 160 + ph * (W + 320), baseY = Y + H * 0.52;
    for (let s = 0; s < 40; s++) {
      const sx = headX - s * 7, sy = baseY + Math.sin(t * 0.8 + s * 0.35) * 9 + Math.sin(s * 0.2) * 4;
      const rad = Math.max(2, 17 - Math.abs(s - 9) * 0.5);
      if (sx < X - 20 || sx > X + W + 20) continue;
      ctx.fillStyle = '#040b10';
      for (let j = -rad; j <= rad; j++) { const hw = Math.floor(Math.sqrt(rad * rad - j * j)); ctx.fillRect(Math.round(sx - hw), Math.round(sy + j), hw * 2 + 1, 1); }
      if (s % 3 === 0) { ctx.fillStyle = (Math.sin(t * 3 + s) > 0.3) ? '#6ff6dc' : '#2a8a7a'; ctx.fillRect(Math.round(sx), Math.round(sy - rad + 2), 1, 1); ctx.fillRect(Math.round(sx - 2), Math.round(sy + rad - 3), 1, 1); }
    }
    // eye
    const ex = Math.round(headX + 6), ey = Math.round(baseY + Math.sin(t * 0.8) * 9 - 2);
    ctx.fillStyle = '#ffb347'; ctx.fillRect(ex, ey, 2, 1);
    // bubbles
    ctx.fillStyle = '#4fb6b8';
    for (let i = 0; i < 10; i++) { const bx = X + ((i * 47) % W) + Math.sin(t + i) * 2, by = Y + H - ((t * 12 + i * 29) % H); ctx.fillRect(Math.round(bx), Math.round(by), 1, 1); }
  },
  /* drawn after the back wall and tiles */
  front(ctx, r, ox, oy, t) {
    const reg = REG[r.reg];
    for (const d of r.def.deco || []) {
      const X = ox + d.x * TILE, Y = oy + d.y * TILE;
      switch (d.k) {
        case 'cable': {
          const amp = r.def.draft ? 3.5 : 1.6, len = d.len * TILE;
          let px = X + 4, py = Y;
          for (let k = 1; k <= len; k++) {
            const f = k / len;
            const x = X + 4 + Math.sin(t * (r.def.draft ? 2.4 : 1.1) + d.x * 1.7 + f * 2.2) * amp * f * f, y = Y + k;
            ctx.fillStyle = k % 6 === 0 ? reg.metL : '#120e18'; ctx.fillRect(Math.round(x), y, 1, 1);
            px = x; py = y;
          }
          ctx.fillStyle = reg.trim; ctx.fillRect(Math.round(px) - 1, py, 3, 2);
          break;

/* ============================ MAIN LOOP ============================
   Fixed 60 Hz simulation with an accumulator; rendering once per frame.
   ================================================================== */
const Main = {
  acc: 0, last: 0, manual: false, frames: 0,
  start() {
    Display.init();
    Input.init();
    buildWorld();
    Objects.init();
    Game.init();
    if (Game.options.sound) Audio.enabled = true; // context is created on the first user gesture
    try { document.fonts.load('16px "Silkscreen"'); document.fonts.load('16px "IBM Plex Mono"'); document.fonts.load('600 16px "IBM Plex Mono"'); } catch (e) { }
    requestAnimationFrame(Main.loop);
  },
  loop(ts) {
    if (!Main.manual) {
      const dt = Math.min(0.1, Math.max(0, (ts - Main.last) / 1000));
      Main.last = ts;
      Main.acc += dt;
      let n = 0;
      while (Main.acc >= DT && n < 5) { Game.step(); Main.acc -= DT; n++; }
      if (n >= 5) Main.acc = 0;
      Render.frame();
      Main.frames++;
    }
    requestAnimationFrame(Main.loop);
  }
};

  tap(action) { this.key(action, true); Game.step(); this.key(action, false); },
  teleport(roomId, tx, ty) {
    const r = World.byId[roomId], p = Game.S.player;
    p.x = (r.tx + tx) * TILE + 4 - p.w / 2; p.y = (r.ty + ty + 1) * TILE - p.h; p.vx = 0; p.vy = 0; p.dead = false; p.hidden = false;
    Game.wardenFight = false; Game.bossBar = null;
    Game.enterRoom(r, true); Game.state = 'play';
  },
  give(...ids) {
    const S = Game.S;
    for (const id of ids) { if (id in S.upgrades) S.upgrades[id] = true; S.items[id] = true; }
  },
  info() {
    const S = Game.S, p = S.player;
    return { state: Game.state, room: Game.room && Game.room.id, x: Math.round(p.x), y: Math.round(p.y), tx: Math.floor((p.x + 4) / TILE) - Game.room.tx, ty: Math.floor((p.y + p.h - 1) / TILE) - Game.room.ty, hp: p.hp, maxHp: p.maxHp, onGround: p.onGround, vx: p.vx, vy: p.vy, dead: p.dead, upgrades: { ...S.upgrades }, flags: { ...S.flags }, items: { ...S.items }, deaths: S.deaths, time: S.time, cp: S.checkpoint.room, enemies: Enemies.list.filter(e => !e.dead).map(e => e.type + ':' + e.state) };
  }
};
window.addEventListener('error', e => { try { console.error('DS-ERROR', e.message, e.filename, e.lineno); } catch (x) { } });
Main.start();
</script>
